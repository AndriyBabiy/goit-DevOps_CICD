version: "3.8"

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5437:5432" # Optional: expose for debugging

  # Django Application
  web:
    build: .
    container_name: django_app
    restart: always
    environment:
      DATABASE_NAME: django_db
      DATABASE_USER: django_user
      DATABASE_PASSWORD: django_password
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DEBUG: "True"
    volumes:
      - .:/app # Mount code for development
      - static_volume:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      - db

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
